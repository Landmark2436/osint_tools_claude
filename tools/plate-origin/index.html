<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plate Origin</title>
<meta name="description" content="Type the first letters of a German number plate and see where it comes from: issuing city or district and federal state.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plate Origin">
<style>
:root {
  --bg: #eef1f5; --panel: #ffffff; --text: #1b2430; --muted: #5d6a7a; --border: #d9dfe6;
  --accent: #2563eb; --input-bg: #ffffff; --code-bg: #ffffff; --code-text: #111111; --eu-blue: #003399;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f141a; --panel: #171e27; --text: #e3e8ef; --muted: #98a4b3; --border: #2b3542;
    --accent: #5b93f5; --input-bg: #0f151c; --code-bg: #f1f1ec; --shadow: none;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif;
}
main { max-width: 560px; margin: 0 auto; padding: 16px 16px 32px; }
h1 { font-size: 15px; margin: 4px 0 12px; color: var(--muted); font-weight: 600; letter-spacing: .3px; }
h1 .version { font-weight: 400; }

.search { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 4px 0 10px; }
.field { display: flex; align-items: stretch; border: 2px solid var(--border); border-radius: 12px; background: var(--input-bg); overflow: hidden; }
.field:focus-within { border-color: var(--accent); }
.field .eu { width: 38px; background: var(--eu-blue); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 7px; font: 700 15px/1 Arial, sans-serif; flex-shrink: 0; }
.field .eu svg { margin: 8px 0 auto; }
.field input {
  flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text);
  font: 700 32px/1 "DIN 1451 Mittelschrift", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  letter-spacing: 2px; padding: 12px 12px; text-transform: uppercase;
}
.field input::placeholder { color: var(--muted); opacity: .5; letter-spacing: 1px; }
.field button { border: 0; background: transparent; color: var(--muted); font-size: 22px; padding: 0 16px; cursor: pointer; }
.field button:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }

.hint { color: var(--muted); font-size: 14px; margin: 8px 2px 0; }
.section { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 600; margin: 18px 2px 8px; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); }
.code {
  flex-shrink: 0; min-width: 64px; text-align: center; padding: 4px 8px; border: 2px solid #111; border-radius: 6px;
  background: var(--code-bg); color: var(--code-text); font: 700 22px/1.1 "DIN 1451 Mittelschrift", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif; letter-spacing: 1px;
}
.body { min-width: 0; }
.place { font-weight: 700; }
.place div + div { margin-top: 2px; }
.state { color: var(--muted); font-size: 14px; }
.note { color: var(--muted); font-size: 13px; margin-top: 2px; }
.item.main { border: 2px solid var(--accent); padding: 14px; }
.item.main .code { font-size: 30px; min-width: 84px; }
.item.main .place { font-size: 20px; line-height: 1.25; }
.item.main .state { font-size: 16px; }
.empty { background: var(--panel); border: 1px dashed var(--border); border-radius: 12px; padding: 16px; color: var(--muted); text-align: center; }

footer { max-width: 560px; margin: 0 auto; padding: 0 16px 24px; color: var(--muted); font-size: 12px; }
footer a { color: var(--accent); }
#tests { margin-top: 8px; white-space: pre-wrap; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
</head>
<body>
<main>
  <h1>Plate Origin <span class="version" id="appVersion"></span></h1>
  <div class="search">
    <div class="field">
      <div class="eu" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 22 22" id="stars"></svg>D</div>
      <input type="text" id="q" placeholder="e.g. FDB" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"
             maxlength="16" enterkeyhint="search" aria-label="First letters of the number plate" autofocus>
      <button type="button" id="clear" aria-label="Clear" hidden>✕</button>
    </div>
  </div>
  <div id="results" aria-live="polite"></div>
</main>
<footer>
  German codes (<i>Unterscheidungszeichen</i>), 706 entries, works offline once loaded. Umlauts can be typed as A, O, U.
  Data: Open Data Berlin (CC BY 3.0 DE) and npm <code>kennzeichen</code> (MIT), with manual updates; entries marked “unverified” were added by hand.
  <a href="#" id="runTests">Self-test</a>
  <div id="tests" hidden></div>
</footer>

const SHARED = {

  AN: ['Stadt Ansbach', 'Landkreis Ansbach'], BA: ['Stadt Bamberg', 'Landkreis Bamberg'],
  BT: ['Stadt Bayreuth', 'Landkreis Bayreuth'], CO: ['Stadt Coburg', 'Landkreis Coburg'],
  'FÜ': ['Stadt Fürth', 'Landkreis Fürth'], HO: ['Stadt Hof', 'Landkreis Hof'],
  LA: ['Stadt Landshut', 'Landkreis Landshut'], M: ['Landeshauptstadt München', 'Landkreis München'],
  MUC: ['Landeshauptstadt München'], MU: ['Landkreis München'],
  PA: ['Stadt Passau', 'Landkreis Passau'], R: ['Stadt Regensburg', 'Landkreis Regensburg'],
  RO: ['Stadt Rosenheim', 'Landkreis Rosenheim'], SR: ['Stadt Straubing', 'Landkreis Straubing-Bogen'],
  SW: ['Stadt Schweinfurt', 'Landkreis Schweinfurt'], 'WÜ': ['Stadt Würzburg', 'Landkreis Würzburg'],
  FR: ['Stadt Freiburg im Breisgau', 'Landkreis Breisgau-Hochschwarzwald'], HD: ['Stadt Heidelberg', 'Rhein-Neckar-Kreis'],
  HN: ['Stadt Heilbronn', 'Landkreis Heilbronn'], KA: ['Stadt Karlsruhe', 'Landkreis Karlsruhe'],
  PF: ['Stadt Pforzheim', 'Enzkreis'], UL: ['Stadt Ulm', 'Alb-Donau-Kreis'],
  DA: ['Stadt Darmstadt', 'Landkreis Darmstadt-Dieburg'], KS: ['Stadt Kassel', 'Landkreis Kassel'],
  OF: ['Stadt Offenbach am Main', 'Kreis Offenbach'],
  KL: ['Stadt Kaiserslautern', 'Landkreis Kaiserslautern'], MZ: ['Stadt Mainz', 'Landkreis Mainz-Bingen'],
  PS: ['Stadt Pirmasens', 'Landkreis Südwestpfalz'], TR: ['Stadt Trier', 'Landkreis Trier-Saarburg'],
  OL: ['Stadt Oldenburg', 'Landkreis Oldenburg'], OS: ['Stadt Osnabrück', 'Landkreis Osnabrück'],
  L: ['Stadt Leipzig', 'Landkreis Leipzig'], HB: ['Stadt Bremen', 'Stadt Bremerhaven'],
};

// Codes without a regular district.
const OTHER = {
  SIH: 'Code in use, issuing district not known here', WIN: 'Code in use, issuing district not known here', WIV: 'Code in use, issuing district not known here',
  BD: 'Federal authorities (Bundestag, Bundesrat, federal government)', BP: 'Federal Police (Bundespolizei)',
  BW: 'Federal waterways and shipping administration', THW: 'Federal Agency for Technical Relief (THW)',
  X: 'NATO headquarters in Germany', Y: 'Bundeswehr (German armed forces)',
  BBL: 'State authorities of Brandenburg', BWL: 'State authorities of Baden-Württemberg', BYL: 'State authorities of Bayern',
  HEL: 'State authorities of Hessen', LSA: 'State authorities of Sachsen-Anhalt', LSN: 'State authorities of Sachsen',
  MVL: 'State authorities of Mecklenburg-Vorpommern', NL: 'State authorities of Niedersachsen',
  NRW: 'State authorities of Nordrhein-Westfalen', RPL: 'State authorities of Rheinland-Pfalz',
  SAL: 'State authorities of Saarland', SH: 'State authorities of Schleswig-Holstein', THL: 'State authorities of Thüringen',
};

/* ---------- Data ---------- */
const fold = (s) => s.replace(/Ä/g, 'A').replace(/Ö/g, 'O').replace(/Ü/g, 'U');
const ENTRIES = (() => {
  const list = [];
  for (const [state, packed] of Object.entries(CODE_DATA)) {
    for (const item of packed.split('|')) {
      const i = item.indexOf(':');
      let code = item.slice(0, i);
      const unverified = code.endsWith('?');
      if (unverified) code = code.slice(0, -1);
      list.push({ code, places: SHARED[code] || [item.slice(i + 1)], state, unverified });
    }
  }
  for (const [code, text] of Object.entries(OTHER)) list.push({ code, places: [text], state: '', other: true });
  for (const e of list) e.key = fold(e.code);
  return list.sort((a, b) => a.code.localeCompare(b.code, 'de'));
})();

/* ---------- Lookup ---------- */
/**
 * Splits the input into the code part and finds matching codes.
 * exact: the letters typed are a code; shorter: codes that are a prefix (the rest would be plate letters);
 * longer: codes that start with the letters typed (only while still typing the code).
 */
function lookup(input) {
  const s = String(input || '').toUpperCase().trim();
  const m = s.match(/^([A-ZÄÖÜ]+)([\s\-:._·]*)(.*)$/);
  if (!m) return { letters: '', exact: [], shorter: [], longer: [] };
  const letters = m[1];
  const key = fold(letters);
  const separated = m[2].length > 0; // "M-…" or "M …": the code ends here
  const more = m[3].length > 0; // digits typed: the code can't get longer
  // Digits right after the letters: real plates always have 1–2 letters after the code, so the code is shorter.
  const exact = more && !separated ? [] : ENTRIES.filter((e) => e.key === key);
  exact.sort((a, b) => (b.code === letters) - (a.code === letters)); // MU before MÜ when MU was typed
  // A shorter code is possible if the remaining 1–2 letters are the plate letters.
  const shorter = separated ? [] : ENTRIES.filter((e) => e.key.length < key.length && key.length - e.key.length <= 2 && key.startsWith(e.key))
    .sort((a, b) => b.key.length - a.key.length);
  const longer = separated || more ? [] : ENTRIES.filter((e) => e.key.length > key.length && e.key.startsWith(key));
  return { letters, exact, shorter, longer };
}

/* ---------- UI ---------- */
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function item(e, main) {
  const state = e.other ? 'Special code' : STATE_NAMES[e.state];
  return `<li class="item${main ? ' main' : ''}"><span class="code">${esc(e.code)}</span><div class="body">` +
    `<div class="place">${e.places.map((p) => `<div>${esc(p)}</div>`).join('')}</div>` +
    `<div class="state">${esc(state)}</div>` +
    (e.places.length > 1 ? '<div class="note">Issued by both, city and district.</div>' : '') +
    (e.unverified ? '<div class="note">unverified</div>' : '') + '</div></li>';
}

function render() {
  const q = $('#q').value;
  $('#clear').hidden = !q;
  try { history.replaceState(null, '', q.trim() ? '#' + encodeURIComponent(q.trim()) : location.pathname + location.search); } catch (e) { /* file:// in some browsers */ }
  const r = lookup(q);
  let html = '';
  if (!q.trim()) {
    html = '<p class="hint">Type the first letters of a plate. Results appear while you type.</p>';
  } else if (!r.letters) {
    html = '<div class="empty">A German plate starts with letters.</div>';
  } else if (!r.exact.length && !r.shorter.length && !r.longer.length) {
    html = `<div class="empty">No German code matches “${esc(r.letters)}”.</div>`;
  } else {
    if (r.exact.length) html += `<ul class="list">${r.exact.map((e, i) => item(e, i === 0)).join('')}</ul>`;
    if (r.shorter.length) html += `<div class="section">${r.exact.length ? 'Or, if the code is shorter' : 'Possible codes'}</div><ul class="list">${r.shorter.map((e) => item(e)).join('')}</ul>`;
    if (r.longer.length) html += `<div class="section">Codes starting with ${esc(r.letters)}</div><ul class="list">${r.longer.map((e) => item(e)).join('')}</ul>`;
  }
  $('#results').innerHTML = html;
}

function runTests() {
  const codes = (list) => list.map((e) => e.code).join(',');
  const cases = [
    ['exact code', () => { const r = lookup('FDB'); return r.exact[0].code === 'FDB' && r.exact[0].places[0] === 'Aichach-Friedberg' && r.exact[0].state === 'BY'; }],
    ['while typing: completions', () => { const r = lookup('FD'); return r.exact[0].code === 'FD' && codes(r.longer).includes('FDB') && codes(r.longer).includes('FDS'); }],
    ['whole plate without separator', () => { const r = lookup('MAB1234'); return !r.exact.length && codes(r.shorter) === 'MA,M' && codes(lookup('MAB').exact) === 'MAB'; }],
    ['separator fixes the code', () => { const r = lookup('m-ab 1234'); return codes(r.exact) === 'M' && !r.shorter.length && !r.longer.length && r.exact[0].places.length === 2; }],
    ['umlaut typed as plain letter', () => { const r = lookup('MU'); return codes(r.exact) === 'MU,MÜ' && r.exact[0].places[0] === 'Landkreis München'; }],
    ['umlaut typed directly', () => codes(lookup('wü').exact) === 'WÜ'],
    ['unknown code', () => { const r = lookup('QX'); return !r.exact.length && !r.shorter.length && !r.longer.length; }],
    ['special code', () => lookup('THW').exact[0].other === true],
    ['digits only / empty', () => lookup('123').letters === '' && lookup('').letters === ''],
    ['data: 16 states, no duplicates', () => new Set(ENTRIES.filter((e) => !e.other).map((e) => e.state)).size === 16 && new Set(ENTRIES.map((e) => e.code)).size === ENTRIES.length && ENTRIES.length >= 720],
    ['escaping', () => esc('<a href="x">') === '&lt;a href=&quot;x&quot;&gt;'],
  ];
  let pass = 0;
  const lines = cases.map(([name, fn]) => { let ok = false; try { ok = !!fn(); } catch (e) { /* counts as failed */ } if (ok) pass++; return `${ok ? '✓' : '✗'} ${name}`; });
  return { pass, total: cases.length, text: `${pass}/${cases.length} passed\n` + lines.join('\n') };
}

$('#appVersion').textContent = 'v' + APP_VERSION;
$('#stars').innerHTML = Array.from({ length: 12 }, (_, i) => {
  const a = (i / 12) * 2 * Math.PI;
  return `<circle cx="${(11 + 7.5 * Math.sin(a)).toFixed(2)}" cy="${(11 - 7.5 * Math.cos(a)).toFixed(2)}" r="1.25" fill="#ffcc00"/>`;
}).join('');
$('#q').addEventListener('input', render);
$('#clear').addEventListener('click', () => { $('#q').value = ''; render(); $('#q').focus(); });
$('#runTests').addEventListener('click', (e) => { e.preventDefault(); const t = $('#tests'); t.hidden = false; t.textContent = runTests().text; });
if (location.hash.length > 1) { try { $('#q').value = decodeURIComponent(location.hash.slice(1)); } catch (e) { /* ignore broken hash */ } }
render();
</script>
